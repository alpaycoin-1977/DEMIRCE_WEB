name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tip denetimi
        run: npm run check
      - name: Derleme — Pafta
        run: npm run build
      - name: Derleme — Monografi
        run: npm run build:alt
      - uses: actions/upload-artifact@v4
        with:
          name: demirce-site
          path: dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: demirce-site-monografi
          path: dist-alt
          retention-days: 7
