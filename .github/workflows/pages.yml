# ÖNİZLEME — GitHub Pages
# main dalına her gönderimde siteyi https://alpaycoin-1977.github.io/DEMIRCE_WEB/
# adresinde yayınlar. Önizleme arama motorlarına kapalıdır (noindex + robots.txt).
# İlk kurulum: GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Önizleme (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Önizleme derlemesi
        run: npm run build
        env:
          SITE_URL: https://alpaycoin-1977.github.io
          SITE_BASE: /DEMIRCE_WEB
          PREVIEW: '1'
      - name: Yalnızca gerçek sunucuda çalışan dosyaları çıkar
        run: rm -f dist/api/contact.php dist/.htaccess dist/_redirects dist/_headers && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
